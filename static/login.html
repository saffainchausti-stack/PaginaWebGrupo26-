<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Indice tp4</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"/>
        
    
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Rum+Raisin&display=swap" rel="stylesheet"/>
      
  </head>
  <body>

    <!-- Contenedor del Formulario de Iniciar Sesión -->
    <section id="login-container">
      <h2>Iniciar Sesión</h2>
      <form action="/login" method="POST">
        <div>
          <label for="login-email">Correo Electrónico:</label>
          <input type="email" id="login-email" name="email" required placeholder="tu@email.com">
        </div>
        <div>
          <label for="login-password">Contraseña:</label>
          <input type="password" id="login-password" name="password" required placeholder="********">
        </div>
        <button type="submit">Ingresar</button>
      </form>
    </section>
  </body>
</html>
