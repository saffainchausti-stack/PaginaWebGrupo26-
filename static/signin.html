<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Indice tp4</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"/>
        
    
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Rum+Raisin&display=swap" rel="stylesheet"/>
      
  </head>
  <body>

    <hr>
    <section id="signin-container">
      <h2>Crear Cuenta</h2>
      <form action="/login" method="POST">
        <div>
          <label for="signin-name">Nombre:</label>
          <input type="text" id="signin-name" name="name" required placeholder="Alejando">
        </div>
        <div>
          <label for="signin-name">Apellido:</label>
          <input type="text" id="signin-surname" name="surname" required placeholder="Zunino">
        </div>
        <div>
          <label for="signin-email">Correo Electrónico:</label>
          <input type="email" id="signin-email" name="email" required placeholder="alejandrozunino2026@email.com">
        </div>
        <div>
          <label for="signin-password">Contraseña:</label>
          <input type="password" id="signin-password" name="password" required placeholder="********">
        </div>
        <button type="submit">Registrarse</button>
      </form>
    </section>
  </body>
</html>
