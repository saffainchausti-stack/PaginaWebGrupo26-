services:
  web:
      build: .
      ports:
        - "8080:8080"
      environment:
      - DATABASE_URL=host=database port=5432 user=postgres password=postgres dbname=recetas sslmode=disable
      depends_on:
        database:
          condition: service_healthy
      healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 3s
  database:
    image: postgres:16-alpine
    container_name: postgres-recetas
    environment:
      - POSTGRES_DB=recetas
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recetas"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
